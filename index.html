<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <title>Avaluatró — Avaluació per competències</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@7.12.1/css/iconoir.css">
    <link rel="stylesheet" href="styles.css">
    <script src="third-party/supabase/supabase.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="Avaluatró, inici">
          <span class="brand-mark">a.</span>
          <span class="brand-name">avaluatró<span class="brand-dot">.</span></span>
        </a>
        <div class="school-label">ESPAI DOCENT</div>
        <nav class="main-nav" aria-label="Navegació principal">
          <button class="nav-link active" data-view="overview"><i class="nav-icon iconoir-home" aria-hidden="true"></i> Resum</button>
          <button class="nav-link" data-view="students"><i class="nav-icon iconoir-group" aria-hidden="true"></i> Alumnes</button>
          <button class="nav-link" data-view="groups"><i class="nav-icon iconoir-view-grid" aria-hidden="true"></i> Grups classe</button>
          <button class="nav-link" data-view="subjects"><i class="nav-icon iconoir-book-stack" aria-hidden="true"></i> Assignatures</button>
          <button class="nav-link" data-view="activities"><i class="nav-icon iconoir-list-select" aria-hidden="true"></i> Activitats i proves</button>
          <button class="nav-link" data-view="daily-followup"><i class="nav-icon iconoir-calendar" aria-hidden="true"></i> Seguiment diari</button>
          <button class="nav-link" data-view="competencies"><i class="nav-icon iconoir-brain" aria-hidden="true"></i> Competències</button>
        </nav>
        <button class="sidebar-bottom profile-button" id="teacher-profile-button" type="button" aria-label="Perfil docent">
          <span class="teacher-avatar" id="sidebar-profile-avatar">D</span>
          <span class="profile-copy"><strong id="sidebar-profile-name">Perfil docent</strong><small id="sidebar-profile-detail">Professional de l'educació</small></span>
          <i class="iconoir-nav-arrow-right profile-settings-icon" aria-hidden="true"></i>
        </button>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <nav class="breadcrumbs" aria-label="Fil d'Ariadna"><strong id="current-section" aria-current="page">Espai docent</strong></nav>
          <div class="top-actions">
            <span class="save-indicator"><span class="save-dot"></span><span id="save-status">Desat al dispositiu</span></span>
            <button class="button button-quiet cloud-indicator" id="cloud-button" type="button" aria-label="Compte i estat del núvol"><span class="cloud-dot"></span><span id="cloud-status">Mode local</span></button>
            <button class="button button-quiet" id="import-button" type="button" aria-label="Importa dades"><i class="iconoir-upload" aria-hidden="true"></i><span class="action-button-label"> Importa</span></button>
            <button class="button button-quiet" id="export-button" type="button" aria-label="Exporta dades JSON"><i class="iconoir-download" aria-hidden="true"></i><span class="action-button-label"> Exporta JSON</span></button>
            <input id="student-csv-file" type="file" accept=".csv,text/csv,text/plain" hidden>
            <input id="daily-csv-file" type="file" accept=".csv,text/csv,text/plain" hidden>
            <input id="import-file" type="file" accept=".json,application/json,text/plain,*/*" hidden>
          </div>
        </header>
        <section id="app-content" class="content" aria-live="polite"></section>
        <footer class="privacy-note"><i class="iconoir-shield-check" aria-hidden="true"></i> <span id="privacy-status">Les dades es desen al dispositiu.</span></footer>
      </main>
    </div>
    <dialog id="app-dialog" class="app-dialog">
      <form id="dialog-form" method="dialog">
        <div id="dialog-content"></div>
      </form>
    </dialog>
    <dialog id="cloud-dialog" class="app-dialog">
      <div id="cloud-dialog-content">
        <div class="dialog-heading"><div><h2>Compte i núvol</h2><p id="cloud-detail">El mode local funciona sense compte.</p></div><button class="icon-button" id="cloud-close" type="button" aria-label="Tanca">×</button></div>
        <form id="cloud-config-form">
          <div class="form-grid">
            <div class="field full"><label for="cloud-email">Correu electrònic</label><input id="cloud-email" type="email" required autocomplete="email"></div>
            <div class="field full"><label for="cloud-password">Contrasenya</label><input id="cloud-password" type="password" required autocomplete="current-password"></div>
          </div>
          <div class="form-actions cloud-actions">
            <button class="button" type="submit" name="action" value="reset" formnovalidate>He oblidat la contrasenya</button>
            <button class="button" id="cloud-signup" type="submit" name="action" value="signup">Crea un compte</button>
            <button class="button button-primary" type="submit" name="action" value="signin">Entra</button>
          </div>
        </form>
        <form id="cloud-recovery-form" hidden>
          <div class="field full"><label for="cloud-new-password">Contrasenya nova</label><input id="cloud-new-password" type="password" required autocomplete="new-password"></div>
          <div class="form-actions"><span></span><button class="button button-primary" type="submit">Desa la contrasenya</button></div>
        </form>
        <div class="form-actions cloud-actions">
          <button class="button" id="cloud-retry" type="button">Torna a sincronitzar</button>
          <button class="button" id="cloud-use-remote" type="button">Carrega la còpia del núvol</button>
          <button class="button button-danger" id="cloud-use-local" type="button">Substitueix la còpia del núvol</button>
          <button class="button" id="cloud-disconnect" type="button">Torna al mode local</button>
        </div>
      </div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
